[project]
name = "z-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django~=6.1",
    "gunicorn>=27.0.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.4",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["static/vendor"]

[tool.ruff.lint]
# E/F: errors, I: imports, UP: modern syntax, B: likely bugs, DJ: Django,
# SIM/C4/RET/PTH: simpler code, S: security
select = ["E", "F", "I", "UP", "B", "DJ", "SIM", "C4", "RET", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use throw-away passwords.
"*/tests/*" = ["S105", "S106"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/wsgi.py", ".venv/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
