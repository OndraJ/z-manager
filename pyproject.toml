[project]
name = "z-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django~=6.1",
    "gunicorn>=27.0.1",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
